name: Daily Instagram post

on:
  schedule:
    - cron: "40 13 * * *"  # 7:10 PM India time; GitHub usually starts it late, so it tends to land near 7:30
    - cron: "45 14 * * *"  # 8:15 PM backup, in case GitHub skips the first run (does nothing if already posted)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (show what would be posted, don't post)"
        type: boolean
        default: true

permissions:
  contents: write           # needed to save schedule.csv and delete the posted image

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post today's quote
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          CATCH_UP: ${{ github.event_name == 'workflow_dispatch' }}
        run: python post.py

      - name: Save progress and clean up
        run: |
          git config user.name "abstractofworld-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A schedule.csv posts
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Posted on $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            git push
          fi
