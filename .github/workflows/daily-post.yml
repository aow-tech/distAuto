name: Daily Instagram post

on:
  schedule:
    # All times are UTC. Keep these in step with CRON_SLOTS in post.py. GitHub usually starts scheduled runs late, so each slot has a backup run.
    - cron: "10 1 * * *"   # morning post: 6:40 AM India (~8 PM US East, ~5 PM US West)
    - cron: "0 2 * * *"    # morning backup: 7:30 AM India (does nothing if already posted)
    - cron: "40 13 * * *"  # evening post: 7:10 PM India (~2 PM UK, ~9 AM US East)
    - cron: "45 14 * * *"  # evening backup: 8:15 PM India (does nothing if already posted)
    - cron: "10 17 * * *"  # theme post: 10:40 PM India (~12 PM US East, ~5 PM UK)
    - cron: "15 18 * * *"  # theme backup: 11:45 PM India (does nothing if already posted)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (show what would be posted, don't post)"
        type: boolean
        default: true

permissions:
  contents: write           # needed to save schedule.csv and delete the posted image

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # always start from the latest progress, even if this run was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          CATCH_UP: ${{ github.event_name == 'workflow_dispatch' }}
          CRON: ${{ github.event.schedule }}
        run: python post.py

      - name: Save progress and clean up
        if: always()        # save whatever was recorded, even if a later step failed
        run: |
          git config user.name "abstractofworld-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A schedule.csv posts
          if git diff --cached --quiet; then
            echo "Nothing to save."
            exit 0
          fi
          git commit -m "Posted on $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && { echo "Saved."; exit 0; }
            echo "Save failed (attempt $attempt), retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::Could not save progress to GitHub."
          exit 1
