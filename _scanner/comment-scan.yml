name: Comment queue scan

# Read-only: looks up new posts from accounts.csv and unanswered comments on our posts.
# Results go to the separate "comment-queue" branch, so this never touches the posting schedule.

on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comment-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scan.py "$RUNNER_TEMP/queue"

      - name: Publish to the comment-queue branch
        run: |
          cd "$RUNNER_TEMP/queue"
          git init -q -b comment-queue
          git config user.name "abstractofworld-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Comment queue $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" comment-queue
